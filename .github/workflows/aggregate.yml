name: Aggregate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if fresh"
        type: boolean
        default: true
  repository_dispatch:
    types: [aggregate-now]
  push:
    paths:
      - "src/pulseconfigs/**"
      - ".github/workflows/aggregate.yml"
      - "pyproject.toml"

concurrency:
  group: pulseconfigs-aggregate
  # Prevent two aggregators from racing on the publish push.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Avoid re-entry from artifact publish commits (path filter is primary; this is belt-and-suspenders)
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # PAT owned by drmikecrypto so publish commits attribute to that account (not github-actions[bot]).
          token: ${{ secrets.PULSE_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Freshness gate
        id: fresh
        if: ${{ github.event_name == 'schedule' && inputs.force != true }}
        continue-on-error: true
        run: |
          if python -m pulseconfigs.cli freshness --index index.json --minutes 12; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install probe tools
        if: steps.fresh.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p .tools

          # xray-knife — extract to a dedicated dir so install never copies onto itself
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip" \
            -o /tmp/xray-knife.zip
          rm -rf /tmp/xray-knife-extract
          unzip -qo /tmp/xray-knife.zip -d /tmp/xray-knife-extract
          BIN=$(find /tmp/xray-knife-extract -type f -name 'xray-knife' | head -n1)
          if [ -z "${BIN}" ]; then
            echo "xray-knife binary not found in archive" >&2
            find /tmp/xray-knife-extract -maxdepth 4 -type f >&2 || true
            exit 1
          fi
          install -m 755 "$BIN" .tools/xray-knife
          .tools/xray-knife version 2>/dev/null || .tools/xray-knife --help | head -n 3 || true

          # sing-box
          SB_VER="1.11.4"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tgz
          tar -xzf /tmp/sing-box.tgz -C /tmp
          install -m 755 "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" .tools/sing-box

          # mihomo
          MH_VER="v1.19.3"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MH_VER}/mihomo-linux-amd64-${MH_VER}.gz" \
            -o /tmp/mihomo.gz
          gunzip -c /tmp/mihomo.gz > .tools/mihomo
          chmod +x .tools/mihomo

          echo "XRAY_KNIFE=$PWD/.tools/xray-knife" >> "$GITHUB_ENV"
          echo "SING_BOX=$PWD/.tools/sing-box" >> "$GITHUB_ENV"
          echo "MIHOMO=$PWD/.tools/mihomo" >> "$GITHUB_ENV"
          echo "PATH=$PWD/.tools:$PATH" >> "$GITHUB_ENV"

      - name: Run aggregator
        if: steps.fresh.outputs.skip != 'true'
        env:
          PULSE_OWNER_REPO: ${{ github.repository }}
          PULSE_REQUIRE_VALIDATORS: "0"
        run: |
          python -m pulseconfigs.cli run --out . --owner-repo "$PULSE_OWNER_REPO" --max-l3 1200

      - name: Publish artifacts
        if: steps.fresh.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "drmikecrypto"
          git config user.email "91358784+drmikecrypto@users.noreply.github.com"
          # Do not commit tool binaries
          rm -rf .tools /tmp/xray-knife-extract 2>/dev/null || true
          git add -A
          git reset -- .tools 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "[auto] PulseConfigs refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Retry rebase+push in case another job edged in (belt-and-suspenders with concurrency).
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "push attempt $i failed; retrying…"
            sleep $((i * 3))
          done
          echo "publish push failed after retries" >&2
          exit 1
